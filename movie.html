<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="わたをが制作したLive2Dモデルの動作サンプル動画ギャラリー。">
  <title>MOVIE｜わたを</title>
  <style>
    :root{--blue:#a8c9dc;--deep:#2e455a;--pale:#dcecf3;--line:#c8dbe4;--white:#fffdf8}
    *{box-sizing:border-box}
    body{margin:0;color:var(--deep);background:var(--pale);font-family:Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;line-height:1.8}
    a{color:inherit;text-decoration:none}
    .nav{position:sticky;top:14px;z-index:5;width:min(1120px,calc(100% - 32px));margin:14px auto 0;padding:12px 20px;border:1px solid rgba(255,255,255,.85);background:rgba(255,255,255,.84);backdrop-filter:blur(14px);border-radius:999px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 10px 35px rgba(70,100,120,.08)}
    .logo{font-weight:900;letter-spacing:.08em}.logo small{display:block;font-size:.65rem;color:#7a858d;letter-spacing:.13em}
    .back{font-size:.82rem;font-weight:800;color:#527f91}
    main{width:min(1120px,100%);margin:auto;padding:70px 28px 100px}
    .eyebrow{font-size:.76rem;letter-spacing:.25em;font-weight:900;color:#5c91a5}
    h1{font-size:clamp(2.8rem,7vw,5.4rem);line-height:1;margin:12px 0 8px;letter-spacing:-.05em}
    .sub{font-size:.95rem;color:#6f858d;letter-spacing:.08em}
    .intro{margin:28px 0 42px;padding:24px 28px;background:rgba(255,255,255,.68);border:1px solid white;border-radius:22px;color:#587482}
    .gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
    .movie-card{overflow:hidden;background:var(--white);border:1px solid white;border-radius:22px;box-shadow:0 12px 28px rgba(65,105,125,.08)}
    .movie-card video{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#eaf3f6}
    .movie-info{padding:17px 20px 20px}
    .movie-info h2{font-size:1.05rem;margin:0 0 4px}
    .movie-info p{font-size:.82rem;color:#71858c;margin:0}
    .empty{padding:58px 24px;text-align:center;background:rgba(255,255,255,.7);border:2px dashed #b9d7e2;border-radius:24px;color:#688793}
    .empty strong{display:block;font-size:1.15rem;color:#47788b;margin-bottom:8px}
    footer{text-align:center;padding:25px;color:#7a929c;font-size:.75rem}
    @media(max-width:700px){main{padding:55px 18px 75px}.gallery{grid-template-columns:1fr}.intro{padding:20px}.nav{top:8px}.back{font-size:.75rem}}
  </style>
</head>
<body>
  <nav class="nav">
    <a class="logo" href="index.html">わたを<small>ILLUSTRATOR / LIVE2D CREATOR</small></a>
    <a class="back" href="index.html">← TOPへ戻る</a>
  </nav>
  <main>
    <div class="eyebrow">LIVE2D MODEL SHOWCASE</div>
    <h1>MOVIE</h1>
    <div class="sub">Motion Gallery</div>
    <div class="intro">制作したLive2Dモデルの動作サンプルをまとめた動画ギャラリーです。表情や髪・身体の揺れ、細かなモーションなど、モデルの動きを動画でご覧いただけます。</div>
    <section class="gallery" aria-label="Live2D動画一覧">
      <div class="empty"><strong>動画を準備中です</strong>サンプル動画を追加すると、こちらに表示されます。</div>
    </section>
  </main>
  <footer>© WATAWO</footer>
</body>
</html>
